<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>명부 서명 만들기 · AX:IS</title>
<link rel="stylesheet" href="/style.css">
</head>
<body>
<header><div class="logo">AX:IS <span>명부 서명</span></div><a class="btn ghost sm" href="#mine" onclick="showMine()">내가 만든 명부</a></header>
<main>
  <div class="card" id="formCard">
    <h1>새 서명 명부 만들기</h1>
    <p class="sub">명단을 입력하고 저장하면 <b>서명 링크</b>와 <b>관리 링크</b>가 발급됩니다. 서명 링크를 단톡방에 공유하세요.</p>

    <label>명부 제목 *</label>
    <input id="title" placeholder="예: AX:IS 10월 정기모임 참석 명부" maxlength="80">
    <div class="row">
      <div><label>일시</label><input id="date" placeholder="예: 2026-10-24 (금) 18:30" maxlength="40"></div>
      <div><label>장소 · 비고</label><input id="desc" placeholder="예: 본관 3층 회의실" maxlength="300"></div>
    </div>

    <label>명단 * <span style="font-weight:400;color:var(--muted)">— 한 줄에 한 명, 소속은 쉼표(,)나 탭으로 구분</span></label>
    <textarea id="members" placeholder="홍길동, 기획처&#10;김철수, 교무처&#10;이영희"></textarea>
    <p class="hint">엑셀에서 [이름][소속] 두 칸을 복사해 그대로 붙여넣어도 됩니다. · 현재 <b id="cnt">0</b>명</p>

    <div id="keyWrap" class="hidden"><label>생성 키 *</label><input id="key" type="password" placeholder="관리자에게 받은 생성 키"></div>

    <div class="btns"><button class="btn blue full" id="createBtn" onclick="create()">저장하고 링크 받기</button></div>
  </div>

  <div class="card hidden" id="doneCard">
    <h1>✅ 명부가 만들어졌어요</h1>
    <p class="sub" id="doneInfo"></p>

    <label>① 서명 링크 — 참석자에게 공유</label>
    <div class="link-box"><code id="signUrl"></code><button class="btn sm" onclick="copy('signUrl')">복사</button></div>

    <label>② 관리 링크 — 나만 보관 (명단 수정·현황·다운로드)</label>
    <div class="link-box"><code id="adminUrl"></code><button class="btn sm" onclick="copy('adminUrl')">복사</button></div>
    <div class="warn-box">⚠️ 관리 링크는 비밀번호와 같아요. 다른 사람에게 공유하지 마세요. 이 기기의 "내가 만든 명부"에도 저장됩니다.</div>

    <div class="btns">
      <a class="btn green" id="goManage">관리 화면 열기</a>
      <button class="btn ghost" onclick="share()">서명 링크 공유하기</button>
      <button class="btn ghost" onclick="location.reload()">새 명부 만들기</button>
    </div>
  </div>

  <div class="card hidden" id="mineCard">
    <h2>이 기기에서 만든 명부</h2>
    <div id="mineList"></div>
  </div>
</main>
<div class="toast" id="toast"></div>
<script>
function copyText(s){if(navigator.clipboard&&isSecureContext)return navigator.clipboard.writeText(s);return new Promise((ok,no)=>{const t=document.createElement('textarea');t.value=s;t.style.position='fixed';t.style.opacity='0';document.body.appendChild(t);t.select();try{document.execCommand('copy')?ok():no()}catch(e){no(e)}t.remove()})}
const $ = id => document.getElementById(id);
function toast(m){const t=$('toast');t.textContent=m;t.classList.add('show');clearTimeout(t._t);t._t=setTimeout(()=>t.classList.remove('show'),2200)}
function parse(){
  return $('members').value.split(/\r?\n/).map(l=>l.trim()).filter(Boolean).map(l=>{
    const p=l.split(/\t|,/).map(s=>s.trim());
    return {name:p[0].replace(/^\d+[.)]\s*/,''), org:p.slice(1).join(' ')};
  }).filter(m=>m.name);
}
$('members').addEventListener('input',()=>{$('cnt').textContent=new Set(parse().map(m=>m.name)).size});
fetch('/api/config').then(r=>r.json()).then(c=>{if(c.needKey)$('keyWrap').classList.remove('hidden')});

async function create(){
  const body={title:$('title').value,date:$('date').value,desc:$('desc').value,members:parse(),key:$('key').value};
  if(!body.title.trim())return toast('명부 제목을 입력하세요');
  if(!body.members.length)return toast('명단을 입력하세요');
  $('createBtn').disabled=true;
  try{
    const r=await fetch('/api/rosters',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});
    const d=await r.json(); if(!r.ok)throw new Error(d.error);
    const sign=location.origin+'/s/'+d.id, admin=location.origin+'/m/'+d.id+'?t='+d.adminToken;
    const mine=JSON.parse(localStorage.getItem('axisRosters')||'[]');
    mine.unshift({id:d.id,title:body.title.trim(),admin,createdAt:new Date().toISOString()});
    localStorage.setItem('axisRosters',JSON.stringify(mine.slice(0,50)));
    $('signUrl').textContent=sign; $('adminUrl').textContent=admin; $('goManage').href=admin;
    $('doneInfo').textContent=`${body.title.trim()} · ${new Set(body.members.map(m=>m.name)).size}명`;
    $('formCard').classList.add('hidden'); $('doneCard').classList.remove('hidden'); scrollTo(0,0);
  }catch(e){toast(e.message||'저장 실패')}finally{$('createBtn').disabled=false}
}
function copy(id){copyText($(id).textContent).then(()=>toast('복사했어요'),()=>toast('길게 눌러 직접 복사하세요'))}
function share(){
  const url=$('signUrl').textContent, text=$('doneInfo').textContent+' 서명 부탁드립니다 🙏';
  if(navigator.share)navigator.share({title:'명부 서명',text,url}).catch(()=>{});
  else copyText(text+'\n'+url).then(()=>toast('공유 문구를 복사했어요'));
}
function showMine(){
  const mine=JSON.parse(localStorage.getItem('axisRosters')||'[]');
  $('mineList').innerHTML=mine.length?mine.map(m=>`<div style="display:flex;justify-content:space-between;gap:8px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)"><div><b>${esc(m.title)}</b><div class="hint">${new Date(m.createdAt).toLocaleString('ko-KR')}</div></div><a class="btn sm" href="${esc(m.admin)}">관리</a></div>`).join(''):'<p class="sub">아직 없어요.</p>';
  $('mineCard').classList.remove('hidden'); $('mineCard').scrollIntoView({behavior:'smooth'});
}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
</script>
</body>
</html>
